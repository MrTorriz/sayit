       180 wide and 9.1 px at 240. Measured, it is marginal at 180 and clean
       from 240. Use 200 px as the floor and 240 where it matters. For smaller
       places use docs/logo.svg, which is the mark on its own.

       Theme: same prefers-color-scheme caveat as docs/logo.svg. -->

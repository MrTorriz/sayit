<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <style>
    :root { --cycle: 9s; }
    .win   { fill: #0d1117; stroke: #30363d; }
    .txt   { fill: #c9d1d9; }
    .dim   { fill: #8b949e; }
    .grn   { fill: #3fb950; }
    .red   { fill: #f85149; }
    .blu   { fill: #58a6ff; }
    .l1 { opacity: 0; animation: l1 9s linear infinite; }
    .l2 { opacity: 0; animation: l2 9s linear infinite; }
    .l3 { opacity: 0; animation: l3 9s linear infinite; }
    .l4 { opacity: 0; animation: l4 9s linear infinite; }
    .recdot { opacity: 0; animation: recdot 9s linear infinite; }
    .cover { animation: reveal 9s infinite; }
    .cursor { opacity: 0; animation: cursor 9s linear infinite; }
    @keyframes l1     { 0%,3%   { opacity: 0 } 5%,96%  { opacity: 1 } 100% { opacity: 0 } }
    @keyframes l2     { 0%,8%   { opacity: 0 } 10%,38% { opacity: 1 } 41%,100% { opacity: 0.35 } }
    @keyframes recdot { 0%,8%   { opacity: 0 } 10% { opacity: 1 } 14% { opacity: 0.2 } 18% { opacity: 1 }
                        22% { opacity: 0.2 } 26% { opacity: 1 } 30% { opacity: 0.2 } 34% { opacity: 1 }
                        38% { opacity: 1 } 41%,100% { opacity: 0 } }
    @keyframes l3     { 0%,41%  { opacity: 0 } 44%,96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes l4     { 0%,49%  { opacity: 0 } 50%,96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes reveal { 0%,52%  { transform: translateX(0); animation-timing-function: steps(38, end); }
                        86%,100% { transform: translateX(460px); } }
    @keyframes cursor { 0%,86%  { opacity: 0 } 88% { opacity: 1 } 91% { opacity: 0 }
                        94% { opacity: 1 } 97%,100% { opacity: 0 } }
  </style>

  <!-- terminal window -->
  <rect class="win" x="1" y="1" width="718" height="216" rx="10"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="22" r="6" fill="#febc2e"/>
  <circle cx="68" cy="22" r="6" fill="#28c840"/>
  <text x="360" y="27" text-anchor="middle" class="dim" font-size="12">sayit — push-to-talk dictation</text>
  <line x1="1" y1="42" x2="719" y2="42" stroke="#30363d"/>

  <!-- 1: trigger -->
  <g class="l1">
    <text x="28" y="78"><tspan class="grn">$</tspan><tspan class="txt" dx="8">sayit start</tspan><tspan class="dim" dx="10">(mouse button held)</tspan></text>
  </g>

  <!-- 2: recording -->
  <g class="l2">
    <text x="46" y="106" class="txt">recording — speak now …</text>
  </g>
  <circle class="recdot" cx="34" cy="101" r="5" fill="#f85149"/>

  <!-- 3: transcribed -->
  <g class="l3">
    <text x="28" y="134"><tspan class="grn">✓</tspan><tspan class="txt" dx="8">transcribed in 1.3 s</tspan><tspan class="dim" dx="10">(whisper.cpp · Vulkan · local)</tspan></text>
  </g>

  <!-- 4: text injected into focused window -->
  <g class="l4">
    <text x="28" y="176"><tspan class="blu">›</tspan><tspan class="txt" dx="8">This sentence was spoken, not typed.</tspan></text>
  </g>
  <!-- cover rect slides right to reveal the injected text character by character -->
  <rect class="cover" x="44" y="162" width="460" height="20" fill="#0d1117"/>
  <rect class="cursor" x="368" y="163" width="9" height="17" fill="#58a6ff"/>
</svg>

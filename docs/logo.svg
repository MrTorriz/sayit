<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="160" height="40" role="img" aria-label="sayit: a voice wave of rounded bars, tallest in the middle, inside a rounded pill">
  <title>sayit</title>
  <!-- The mark on its own: the recording pill exactly as bin/sayit-overlay
       draws it on screen while you speak: the voice wave inside a filled pill
       with a hairline border. The geometry is not drawn
       by hand here; docs/build-logo.py reads it out of the overlay's own
       constants, so the logo cannot drift away from the thing the user sees.

       Colour: the pill is dark and the ink white in both themes, because the
       pill itself is dark on every desktop. It is a screen object, not a piece
       of page furniture, and inverting it would picture something that does
       not exist.

       Size: the bars are 3 units wide with 3 between, so the wave reads from
       about 120 px wide. Use 120 as the floor.

       docs/logo-lockup.svg adds the wordmark and the tagline below it. -->
  <style>
    .p { fill: #000000; stroke: #ffffff; stroke-width: 1.2; }
    .w { fill: #ffffff; }
  </style>
  <rect class="p" x="0.60" y="0.60" width="158.80" height="38.80" rx="12"/>
  <rect class="w" x="18.500" y="15.615" width="3.000" height="8.771" rx="1.500"/>
  <rect class="w" x="24.500" y="14.964" width="3.000" height="10.071" rx="1.500"/>
  <rect class="w" x="30.500" y="13.558" width="3.000" height="12.884" rx="1.500"/>

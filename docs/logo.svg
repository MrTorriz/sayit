  <rect class="w" x="42.500" y="13.983" width="3.000" height="12.034" rx="1.500"/>
  <rect class="w" x="48.500" y="11.222" width="3.000" height="17.557" rx="1.500"/>
  <rect class="w" x="54.500" y="9.927" width="3.000" height="20.146" rx="1.500"/>
  <rect class="w" x="60.500" y="11.173" width="3.000" height="17.654" rx="1.500"/>
  <rect class="w" x="66.500" y="9.378" width="3.000" height="21.243" rx="1.500"/>
  <rect class="w" x="72.500" y="6.269" width="3.000" height="27.461" rx="1.500"/>
  <rect class="w" x="78.500" y="6.594" width="3.000" height="26.813" rx="1.500"/>
  <rect class="w" x="84.500" y="10.323" width="3.000" height="19.355" rx="1.500"/>
  <rect class="w" x="90.500" y="8.049" width="3.000" height="23.902" rx="1.500"/>
  <rect class="w" x="96.500" y="8.862" width="3.000" height="22.276" rx="1.500"/>

name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - Windows 11
        - Both
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that sayit makes hard or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >-
        Note the deliberate non-goals: cloud speech-to-text backends, wake-word
        activation, GUI frontends, and shared code across the two platforms.
        Requests for those will be declined - see docs/ARCHITECTURE.md.

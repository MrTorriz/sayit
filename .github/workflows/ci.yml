# CI: syntax + lint on every script (bash and Python alike), and the bats
# test suite. Runs on push and pull requests.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          for f in bin/* install.sh tests/*.sh; do
            [ -e "$f" ] || continue
            case "$(head -1 "$f")" in
              *python*) python3 -m py_compile "$f" ;;
              *bash*|*/sh)  bash -n "$f" ;;
              *) echo "no known interpreter: $f" >&2; exit 1 ;;
            esac
          done
      - name: shellcheck
        run: |
          scripts=()
          for f in bin/* install.sh tests/*.sh; do
            [ -e "$f" ] || continue
            case "$(head -1 "$f")" in
              *bash*|*/sh) scripts+=("$f") ;;
            esac
          done
          shellcheck "${scripts[@]}"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run test suite
        run: bats tests/

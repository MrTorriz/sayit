# CI: syntax + lint on every script (bash and Python alike), and the bats
# test suite. Runs on push and pull requests.
#
# Three platforms. The Linux jobs glob bin/, install.sh, mac/'s shell scripts,
# tests/*.sh and docs/*.py and run the whole bats suite (tests/mac.bats forces
# the macOS branches through OSTYPE, so it runs there too); the windows job
# covers win/, and the macos job builds the Swift targets and runs the suite on
# a real Mac. The one place a Linux job reads win/ or mac/Sources is the
# geometry check below, which compares the Windows and macOS pills' constants
# against the overlay's as text: it needs neither PowerShell nor Swift, and it
# is the only thing that notices when the drawings of one pill drift apart.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          for f in bin/* install*.sh mac/*.sh mac/sayit-doctor mac/tests/*.sh \
                   tests/*.sh docs/*.py engines/openvino/*.py; do
            [ -f "$f" ] || continue
            case "$(head -1 "$f")" in
              *python*) python3 -m py_compile "$f" ;;
              *bash*|*/sh)  bash -n "$f" ;;
              *) echo "no known interpreter: $f" >&2; exit 1 ;;
            esac
          done
      - name: shellcheck
        run: |
          scripts=()
          for f in bin/* install*.sh mac/*.sh mac/sayit-doctor mac/tests/*.sh \
                   tests/*.sh docs/*.py engines/openvino/*.py; do
            [ -f "$f" ] || continue
            case "$(head -1 "$f")" in
              *bash*|*/sh) scripts+=("$f") ;;
            esac
          done
          shellcheck "${scripts[@]}"

      # The Windows indicator and Sayit.app keep hand-made copies of the pill's
      # geometry, because neither PowerShell nor Swift can read the overlay's
      # Python constants. Nothing else would notice if they disagreed.
      - name: Windows and macOS pills match the overlay
        run: python3 docs/check-geometry.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run test suite
        run: bats tests/

  openvino-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install numpy==2.5.3
      - name: Protocol, model integrity and service rollback
        run: python -m unittest discover -s engines/openvino -v

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # bash 5 too: the scripts need it, and the system's /bin/bash is 3.2.
      - name: Install bash, bats and shellcheck
        run: brew install bash bats-core shellcheck

      - name: Syntax check and shellcheck
        run: |
          for f in mac/install.sh mac/sayit-doctor mac/tests/*.sh; do
            bash -n "$f"
          done
          shellcheck mac/install.sh mac/sayit-doctor mac/tests/*.sh

      # The compiler invocations of mac/install.sh, into a scratch directory:
      # no bundle, no signing, no install and no launchctl.
      - name: Compile the Swift targets
        run: |
          out=$(mktemp -d)
          swiftc=(swiftc -O -swift-version 5 -target "$(uname -m)-apple-macos14.0")
          "${swiftc[@]}" mac/Sources/Common/*.swift mac/Sources/Rec/main.swift -o "$out/sayit-rec"
          "${swiftc[@]}" mac/Sources/Paste/main.swift -o "$out/sayit-paste"
          "${swiftc[@]}" mac/Sources/Common/*.swift mac/Sources/Agent/*.swift -o "$out/Sayit"

      - name: Swift unit tests
        run: mac/tests/run.sh

      - name: macOS test suite
        run: bats tests/mac.bats

      # The Linux-path tests pin OSTYPE=linux-gnu and skip what needs /proc or
      # GNU stat, so they run on a Mac too.
      - name: Rest of the test suite
        run: bats $(ls tests/*.bats | grep -v '/mac\.bats$')

      - name: Windows and macOS pills match the overlay
        run: python3 docs/check-geometry.py

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          $failed = $false
          Get-ChildItem win -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors[0].Message)"
            }
          }
          if ($failed) { exit 1 }

      # The C# helpers are compiled at runtime by Add-Type, so a syntax error in
      # them would otherwise only surface on a user's machine.
      - name: Compile C# helpers
        run: |
          . .\win\lib\common.ps1
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -TypeDefinition (Read-Utf8Text "win\lib\Recorder.cs") -Language CSharp
          Add-Type -TypeDefinition (Merge-CSharpSources -Sources @(
                     (Read-Utf8Text "win\lib\Trigger.cs"),
                     (Read-Utf8Text "win\lib\Injector.cs"))) `
                   -Language CSharp -ReferencedAssemblies 'System.Windows.Forms','System.Drawing'
          Add-Type -TypeDefinition (Read-Utf8Text "win\lib\RawInput.cs") `
                   -Language CSharp -ReferencedAssemblies 'System.Windows.Forms','System.Drawing'

      - name: PSScriptAnalyzer
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $results = Invoke-ScriptAnalyzer -Path win -Recurse -Severity Error
          if ($results) { $results | Format-Table -AutoSize; exit 1 }

      - name: Run test suite
        run: .\win\tests\Invoke-Tests.ps1
